<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <form id="formCadastro">

            <input
                type="text"
                id="nome"
                placeholder="Nome do aluno"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="text"
                id="matricula"
                placeholder="Matrícula"
                required
            >

            <input
                type="text"
                id="curso"
                placeholder="Curso"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <h2>Alunos cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Matrícula</th>
                    <th>Curso</th>
                </tr>
            </thead>

            <tbody id="listaAlunos">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
